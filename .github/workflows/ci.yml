name: JOVI Flow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint & Validate ────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint eslint@8

      - name: Install project deps
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: HTMLHint
        run: htmlhint src/poc/index.html src/prototype/index.html

      - name: Stylelint (Tailwind source)
        run: npx stylelint "src/poc/css/input.css" --allow-empty-input

      - name: ESLint (app.js)
        run: npx eslint "src/**/js/app.js" --no-error-on-unmatched-pattern

      - name: CSS build is in sync
        run: |
          npm run css
          git diff --exit-code -- src/poc/css/jovi.css \
            || (echo "::error::src/poc/css/jovi.css is stale — run 'npm run css' and commit" && exit 1)

  # ── Security Scan ──────────────────────────────────────
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy POC to GitHub Pages ──────────────────────────
  deploy:
    needs: [lint, sast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/poc

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
